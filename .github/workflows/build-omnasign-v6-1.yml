name: Build OmnaSign 6.1 — web-linked Apple Account companion
on:
  push:
    branches: [omnasign-apple-account-windows-v6-1]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-omnasign-v6-1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omnasign-v6-1-windows
  cancel-in-progress: true
jobs:
  full-bundle:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download pinned MIT-licensed iPASide engine source
        shell: pwsh
        run: |
          git clone --quiet https://github.com/pwnapplehat/iPASide.git upstream-ipaside
          git -C upstream-ipaside checkout cd27ac986a2f048a7075f3d15ab8587ae4ac8730
          $commit = (git -C upstream-ipaside rev-parse HEAD).Trim()
          if ($commit -ne 'cd27ac986a2f048a7075f3d15ab8587ae4ac8730') { throw "Unexpected upstream commit" }
          Write-Host "Pinned upstream iPASide at $commit"
      - name: Create portable embedded Apple Account engine
        shell: pwsh
        run: |
          Push-Location upstream-ipaside
          try {
            pwsh -NoProfile -File packaging/build-engine.ps1 -Python (Get-Command python).Source
            if ($LASTEXITCODE -ne 0) { throw "Portable engine failed" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path upstream-ipaside/dist/engine/python/python.exe)) { throw "Missing engine runtime" }
      - name: Build self-contained native GUI
        shell: pwsh
        run: |
          dotnet publish desktop/OmnaSignDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -o publish
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path publish/OmnaSignDesktop.exe)) { throw "Windows build failed" }
      - name: Assemble portable Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/OmnaSign-6/engine | Out-Null
          Copy-Item publish/OmnaSignDesktop.exe release/OmnaSign-6/OmnaSignDesktop.exe
          Copy-Item upstream-ipaside/dist/engine/python release/OmnaSign-6/engine/python -Recurse
          Copy-Item upstream-ipaside/LICENSE release/OmnaSign-6/iPASide-MIT-LICENSE.txt
          @"
          OmnaSign Desktop v6.1 - Windows x64
          --------------------------------
          1. Unzip the FULL bundle.
          2. Run OmnaSignDesktop.exe from inside the extracted OmnaSign-6 folder.
          3. Open the browser signer and choose Apple Account. Click "Open Apple Account signer". Or choose Apple Account signing directly in the desktop app.
          4. Sign in locally, complete Apple 2FA, trust your iPhone, and choose an IPA to sign or install.
          5. Manual certificate signing is still available using zsign.exe (separate tool).
          6. Experimental USB developer-location testing uses a separately installed pymobiledevice3 command.
          7. The embedded MIT-licensed iPASide engine implements Apple account login and provisioning.
          No Apple ID password is stored by OmnaSign. Its engine maintains its own Apple session.
          Apple ID service compatibility and real IPA installation have not been verified in this CI build.
          Free Apple provisioning expires after approximately seven days.
          "@ | Out-File -FilePath release/OmnaSign-6/README.txt -Encoding utf8
          Get-ChildItem release/OmnaSign-6 | Select-Object Name
      - name: Verify engine and native UI startup
        shell: pwsh
        run: |
          & release/OmnaSign-6/engine/python/python.exe -m ipaside_engine version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Apple Account engine failed to start" }
          $exe = (Resolve-Path "release/OmnaSign-6/OmnaSignDesktop.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 7
          $p.Refresh()
          if ($p.HasExited) { throw "Native window exited early: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Native OmnaSign Windows startup smoke test passed."
          $key = "HKCU:\Software\Classes\omnasign"
          if (-not (Test-Path $key)) { throw "Custom omnasign:// URL handler not registered" }
          $registered = (Get-Item -LiteralPath "$key\shell\open\command").GetValue("")
          if ($registered -notlike "*OmnaSignDesktop.exe*") { throw "Incorrect protocol command: $registered" }
          $deep = Start-Process -FilePath $exe -ArgumentList "omnasign://apple-account" -PassThru
          Start-Sleep -Seconds 6
          $deep.Refresh()
          if ($deep.HasExited) { throw "Apple Account deep-link window exited early with code $($deep.ExitCode)" }
          Stop-Process -Id $deep.Id -Force
          Write-Host "Apple Account deep-link startup smoke test passed."
      - name: Package ZIP with complete engine
        shell: pwsh
        run: |
          Compress-Archive -Path release/OmnaSign-6 -DestinationPath OmnaSign-Windows-v6.1-Full-Bundle.zip -CompressionLevel Optimal
          $size = [math]::Round((Get-Item OmnaSign-Windows-v6.1-Full-Bundle.zip).Length / 1MB, 1)
          Write-Host "Full bundle: $size MB"
      - uses: actions/upload-artifact@v4
        with:
          name: OmnaSign-6.1-Windows-Full-Bundle
          path: OmnaSign-Windows-v6.1-Full-Bundle.zip
          if-no-files-found: error
